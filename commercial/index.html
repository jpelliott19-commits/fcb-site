<style>
body.lp.white{background:#fff}
.white .lp-screen{background:#fff}
.white .lp-inner{color:var(--ink);padding:14px 18px 20px;gap:14px;justify-content:flex-start}

.white .photo{position:relative;height:190px;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(15,21,16,.16)}
.white .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 75%}
.white .photo img.before{clip-path:inset(0 50% 0 0)}
.white .photo .line{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.25)}
.white .photo .tag{position:absolute;top:auto;bottom:10px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(15,21,16,.18)}
.white .photo .tag.b{left:10px;right:auto;background:#fff;color:var(--ink)}
.white .photo .tag.a{right:10px;left:auto;background:#39B54A;color:#07100A}
.white .lp-cols{gap:16px}
.white .lp-left h1{color:var(--ink);text-shadow:none;font-size:34px;line-height:1.02;margin:0}
.white .lp-left h1 .acc{color:#1F7A32;display:block}
.white .lp-rule{background:#39B54A;opacity:1;margin:14px 0 0;width:84px}
.white .lp-bullets{margin:14px 0 0;gap:8px}
.white .lp-bullets li{color:#2C352E;font-size:16px}
.white .lp-bullets li:before{background:#1F7A32;border-color:#1F7A32}
.white .lp-bullets li:after{border-color:#fff}
.white .lp-form{background:#F4F7F2;border:1.5px solid #E1E8DD;backdrop-filter:none;padding:12px;gap:8px}
.white .lp-form input,.white .lp-form select{background:#fff;border:1.5px solid #D9E2D5;color:var(--ink);padding:11px 13px;font-size:16px}
.white .lp-form input::placeholder{color:#8A968C}
.white .lp-form select{color:#6E7A70}
.white .lp-note{color:var(--grey);font-size:13px}
/* same stacked phone layout as the ad, on every screen */
.white .lp-screen{min-height:0}
.white .lp-inner{max-width:480px;margin:0 auto;padding:14px 18px 20px;gap:14px}
.white .lp-cols{grid-template-columns:1fr !important;gap:16px}
.white .photo{height:240px}
.white .photo img{object-position:50% 30%}
.white .lp-left h1{font-size:34px}
.white .lp-call{background:#0F1510;color:#fff}
.white .lp-form .btn{background:#39B54A;color:#07100A}
.white .lp-form input,.white .lp-form select{padding:11px 13px}
.white .photo .tag.a{background:#0F1510;color:#fff}
.white .pick{background:#fff;border:1.5px solid #D9E2D5;border-radius:10px;color:#6E7A70;font-size:16px}
.white .pick summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}
.white .pick summary::-webkit-details-marker{display:none}
.white .pick summary:after{content:"";width:8px;height:8px;margin:-3px 3px 0 8px;border-right:2px solid #6E7A70;border-bottom:2px solid #6E7A70;transform:rotate(45deg);transition:transform .15s}
.white .pick[open] summary:after{transform:rotate(225deg);margin-top:3px}
.white .pick.on summary{color:var(--ink)}
.white .pick-menu{display:grid;gap:2px;padding:0 8px 8px}
.white .pick-menu label{display:flex;align-items:center;gap:10px;padding:9px 6px;color:var(--ink);cursor:pointer}
.white .lp-form .pick-menu input{width:20px;height:20px;padding:0;flex:none;accent-color:#1F7A32}
</style>

<body class="lp lp-nologos white">

<main class="lp-screen">
  <div class="lp-inner">
    <header class="lp-top">
      <img src="../assets/logo.png" alt="Front and Center Bin Cleaning LLC" />
      <div class="lp-top-txt"><b>Front and Center</b><span>Commercial cleaning</span></div>
      <a class="lp-call" href="tel:18172867069">(817) 286-7069</a>
    </header>

    <div class="photo"><img src="../assets/commercial-hero.jpg?v=1" alt="Front and Center truck and rig outside a Texas Best BBQ" /></div>

    <div class="lp-cols">
      <div class="lp-left">
        <h1>Keep your property<span class="acc">spotless.</span></h1>
        <div class="lp-rule"></div>
        <ul class="lp-bullets">
          <li>Storefronts, buildings and lots</li>
          <li>Concrete and fuel pad cleaning</li>
          <li>Parking lot striping</li>
          <li>One invoice for every location</li>
        </ul>
      </div>

      <form class="lp-form" id="quote">
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
        <label class="sr">Name<input type="text" name="name" placeholder="Name" required /></label>
        <label class="sr">Phone<input type="tel" name="phone" placeholder="Phone" required /></label>
        <label class="sr">Company<input type="text" name="company" placeholder="Company" /></label>
        <details class="pick" id="svc">
          <summary><span id="svc-label">What needs cleaning?</span></summary>
          <div class="pick-menu">
            <label><input type="checkbox" name="service" value="Building wash" />Building wash</label>
            <label><input type="checkbox" name="service" value="Concrete or parking lot" />Concrete or parking lot</label>
            <label><input type="checkbox" name="service" value="Fuel pad or canopy" />Fuel pad or canopy</label>
            <label><input type="checkbox" name="service" value="Pavement striping" />Pavement striping</label>
            <label><input type="checkbox" name="service" value="Surface sealing" />Surface sealing</label>
            <label><input type="checkbox" name="service" value="Roof" />Roof</label>
            <label><input type="checkbox" name="service" value="Sanitation" />Sanitation</label>
          </div>
        </details>
        <button class="btn btn-cream" type="submit">Get a quote</button>
        <p class="lp-note" id="note">Veteran owned, 5.0 on Google</p>
      </form>
    </div>
  </div>
</main>

<script>
  // what needs cleaning: tick as many as apply, the closed box lists them
  const svc = document.getElementById("svc");
  svc.addEventListener("change", () => {
    const on = [...svc.querySelectorAll("input:checked")].map((i) => i.value);
    document.getElementById("svc-label").textContent = on.join(", ") || "What needs cleaning?";
    svc.classList.toggle("on", on.length > 0);
  });

  // the form posts to our lead function, which emails the shop
  const form = document.getElementById("quote");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form), btn = form.querySelector("button"), note = document.getElementById("note");
    btn.disabled = true; btn.textContent = "Sending...";
    const r = await fetch("https://fizfyydpzirrealezxlj.supabase.co/functions/v1/site-lead", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ site: "fcbcs.com", name: fd.get("name"), phone: fd.get("phone"), address: fd.get("address"), services: fd.getAll("service"), details: fd.get("company") ? "Company: " + fd.get("company") : null, website: fd.get("website"), page: location.pathname }),
    }).catch(() => null);
    if (r && r.ok) { if (window.fbq) fbq("track", "Purchase", { currency: "USD", value: 1 }); form.classList.add("sent"); btn.textContent = "Sent"; note.textContent = "Got it. We'll call you soon."; }
    else { btn.disabled = false; btn.textContent = "Get a quote"; note.textContent = "That didn't go through. Call (817) 286-7069."; }
  });
</script>
</body>
</html>
